<html lang="en">

         Fewer faces = fewer blocking font requests on first paint. -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&family=JetBrains+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet" />

  <body>
    <div id="root"></div>
    <form name="mentorax-enquiry" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <select name="interest"><option>Mentorship programme</option></select>
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
